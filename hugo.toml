baseURL = 'https://kimminsan.com/'
locale = 'ko-KR'
defaultContentLanguage = 'ko'
timeZone = 'Asia/Seoul'
title = '김민산'
enableRobotsTXT = true
capitalizeListTitles = false
summaryLength = 60

[params]
  description = '임베디드 · C/C++ · STM32'
  author = '김민산'
  github = 'https://github.com/als21021'
  email = ''  # 비워 두면 메일 링크가 표시되지 않음

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'

[menus]
  [[menus.main]]
    name = '프로젝트'
    pageRef = '/projects'
    weight = 10
  [[menus.main]]
    name = '글'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = '소개'
    pageRef = '/about'
    weight = 30

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark.renderer]
    unsafe = false

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html']
